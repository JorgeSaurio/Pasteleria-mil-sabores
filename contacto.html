  <!-- Formulario de contacto -->



    <div class="container my-5">
      <h1 class="text-center mb-4">
        Contacto
      </h1>
      <form id="signup-form" data-tipo="contacto">
        <div class="mb-3">
          <label for="nombrecontacto" class="form-label">
            NOMBRE
          </label>
          <input type="text"
                  class="form-control"
                  id="nombrecontacto"
                  name="nombrecontacto"
                  placeholder="Juan Perez"
                  required>

        </div>
        <div class="mb-3">
          <label for="correocontacto" class="form-label">
            CORREO
          </label>
          <input type="email"
                  class="form-control"
                  id="correocontacto"
                  name="correocontacto"
                  placeholder="LoremIpsum@duocuc.cl"
                  required>
        </div>
          

        <div class="mb-3">
          <label for="comentariocontacto" class="form-label">
            COMENTARIO
          </label>
          <textarea class="form-control"
            id="comentariocontacto"
            name="comentariocontacto"
            rows="5"
            placeholder="Escribe tu comentario aquí"
            required>
          </textarea>
        </div>
        <div class="d-grid">
            <button type="submit"
                    class="btn btn-outline-dark">
                Envíar comentario
            </button>
        </div>
      </form>


  </div>
