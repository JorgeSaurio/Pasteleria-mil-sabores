  <!-- Registro de usuario -->

  <div class="container my-5">

    <h1 class="text-center mb-4">
      Registro de usuario
    </h1>

    <form id="signup-form" data-tipo="registro">

      <div class="mb-3">

        <label for="run" class="form-label">
          RUN
        </label>

        <input type="text" class="form-control" id="run" name="run" placeholder="21.088.533-1" required>

      </div>

      <div class="mb-3">
        <label for="name" class="form-label">
          NOMBRE
        </label>

        <input type="text" class="form-control" id="name" name="name" placeholder="John" required>

      </div>

      <div class="mb-3">
        <label for="apellidos" class="form-label">
          APELLIDOS
        </label>
        <input type="text" class="form-control" id="apellidos" name="apellidos" placeholder="Doe Salinas" required>

      </div>

      <div class="mb-3">
        <label for="email" class="form-label">
          CORREO
        </label>

        <input type="email" class="form-control" id="email" name="email" placeholder="LoremIpsum@duocuc.cl" required>
      </div>

      <div class="mb-3">
        <label for="email2" class="form-label">
          CONFIRMAR CORREO
        </label>

        <input type="email" class="form-control" id="email2" name="email2" placeholder="LoremIpsum@duocuc.cl" required>
      </div>



      <div class="mb-3">
        <label for="nacimiento" class="form-label">
          FECHA NACIMIENTO
        </label>

        <input type="date" id="nacimiento" name="nacimiento">

      </div>


      <div class="mb-3">
        <label for="region" class="form-label">
          REGIÓN
        </label>

        <select id="region" name="region" class="form-select" required>
          <option value="">
            SELECCIONA UNA REGIÓN
          </option>
        </select>
      </div>


      <div class="mb-3">
        <label for="comuna" class="form-label">
          COMUNA
        </label>

        <select id="comuna" name="comuna" class="form-select" required disabled>
          <option value="">
            Selecciona una región
          </option>
        </select>
      </div>


      <div class="mb-3">
        <label for="password" class="form-label">
          CONTRASEÑA
        </label>

        <input type="password" class="form-control" id="password" name="password" placeholder="****" required>
      </div>

      <div class="mb-3">
        <label for="password2" class="form-label">
          CONFIRMAR CONTRASEÑA
        </label>

        <input type="password" class="form-control" id="password2" name="password2" placeholder="****" required>
      </div>

      <div class="mb-3">
        <label for="tel" class="form-label">
          TELÉFONO (opcional)
        </label>

        <input type="tel" class="form-control" id="tel" name="tel" placeholder="+56912345678"
          pattern="(\+56)?9[0-9]{8}">
      </div>


      <div class="mb-3">
        <label for="dir" class="form-label">
          DIRECCIÓN
        </label>
        <input type="text" class="form-control" id="dir" name="dir" placeholder="Avenida Siempre Viva 123" required>
      </div>



      <div class="d-grid">
        <button type="submit" class="btn btn-outline-dark">
          REGISTRAR
        </button>
      </div>

    </form>

  </div>
